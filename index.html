<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- This document holds the preload bridge, so it is the highest-value target
     in the app: script running here can talk to the main process. The policy
     below is therefore as tight as the UI allows.

     script-src has no 'unsafe-inline' — renderer.js is a real file and there
     are no inline <script> tags, so injected markup cannot execute.
     style-src keeps it only because the stylesheet below is inline; that is a
     far smaller risk, and moving it out is a tidy-up for another day.
     img-src allows https so remote favicons render in the tab strip.
     connect-src is 'none': this UI has no business opening a socket.

     `file:` is listed alongside 'self' deliberately: this document is loaded
     with loadFile(), so its origin is a file: origin, and 'self' alone does
     not reliably match one. Omit it and the whole UI silently fails to load
     its own script.

     frame-src is open because a <webview> is created as a frame and would
     otherwise be refused — which would block every web page in the browser.
     It costs nothing here: with script-src locked down there is no way to
     inject a frame in the first place. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: https:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src *; child-src *; frame-ancestors 'none';" />
<meta name="referrer" content="no-referrer" />
<title>Brisk</title>
<style>
  /* ---------- Palette ----------
     Light, and strictly monochrome. Chrome's identity is its blue-grey
     neutrals and the #8ab4f8 accent; there is no hue anywhere here, so
     nothing can read as Chrome.

     The value order is: tab strip recessed grey, toolbar a shade lighter,
     active tab pure white so it lifts off the strip.

     Two values are mirrored in main.js and must be changed together:
     --chrome-bg matches titleBarOverlay.color, --text matches symbolColor. */
  :root {
    --chrome-bg:      #e6e6e6;
    --toolbar-bg:     #f7f7f7;
    --tab-active:     #ffffff;
    --tab-hover:      #efefef;
    --omnibox-bg:     #ebebeb;
    --omnibox-focus:  #e2e2e2;
    --text:           #111111;
    --text-dim:       #5f5f5f;
    --text-faint:     #a6a6a6;  /* disabled controls only */
    --accent:         #111111;
    --border:         #d4d4d4;
  }

  * { box-sizing: border-box; }

  /* The gutter around the floating page area shows through from here, so it
     matches the toolbar directly above it — using --chrome-bg would leave a
     visible seam where the toolbar ends. */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--toolbar-bg);
    color: var(--text);
    font: 13px/1.4 system-ui, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }

  /* position: relative so the engine menu can anchor to the window. */
  #app { display: flex; flex-direction: column; height: 100%; position: relative; }

  /* ---------- Tab strip ---------- */
  /* With the OS title bar gone, this strip is the window's drag handle.
     The big right padding clears the native minimize/maximize/close buttons,
     which Electron paints over this area (titleBarOverlay in main.js). */
  #tabstrip {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 40px;
    padding: 6px 8px 0;
    background: var(--chrome-bg);
    flex: 0 0 auto;
    -webkit-app-region: drag;
  }

  /* Only on Windows do native caption buttons sit over this strip, so only
     there do we reserve room for them. Elsewhere the window keeps its normal
     title bar and the tabs can use the full width. */
  body.has-overlay #tabstrip { padding-right: 148px; }

  /* Anything clickable must opt out of the drag region, or it can't be
     clicked — the OS swallows the press as a window move. */
  .tab,
  #newtab { -webkit-app-region: no-drag; }

  /* Fullscreen hides the native caption buttons, so reclaim their space. */
  body.fullscreen #tabstrip { padding-right: 8px; }

  #tabs {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
  }

  /* Detached rounded pills, not Chrome's fused-to-the-toolbar trapezoids.
     The active tab is marked by a lighter fill rather than by merging into
     the row below it. */
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    margin-bottom: 4px;
    padding: 0 8px 0 12px;
    min-width: 60px;
    max-width: 220px;
    flex: 1 1 200px;
    border-radius: 15px;
    background: transparent;
    cursor: default;
    overflow: hidden;
  }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { background: var(--tab-active); }
  .tab.active:hover { background: var(--tab-active); }

  .favicon {
    width: 16px; height: 16px;
    flex: 0 0 16px;
    border-radius: 3px;
    object-fit: contain;
  }
  .favicon.blank { background: var(--border); }

  .spinner {
    width: 14px; height: 14px;
    flex: 0 0 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab.loading .spinner { display: block; }
  .tab.loading .favicon { display: none; }

  .tab-title {
    flex: 1 1 auto;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .tab:not(.active) .tab-title { color: var(--text-dim); }

  .tab-close {
    flex: 0 0 18px;
    width: 18px; height: 18px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    font-size: 15px; line-height: 1;
    cursor: default;
    opacity: 0;
  }
  .tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
  .tab-close:hover { background: var(--border); color: var(--text); }

  #newtab {
    flex: 0 0 30px;
    width: 30px; height: 30px;
    margin-bottom: 4px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    font-size: 18px; line-height: 1;
    cursor: default;
  }
  #newtab:hover { background: var(--tab-hover); color: var(--text); }

  /* ---------- Toolbar ---------- */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 44px;
    padding: 0 8px;
    background: var(--toolbar-bg);
    flex: 0 0 auto;
  }

  .navbtn {
    flex: 0 0 30px;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border: 0; border-radius: 50%;
    background: transparent;
    color: var(--text);
    cursor: default;
    padding: 0;
  }
  .navbtn:hover:not(:disabled) { background: rgba(0,0,0,.08); }
  .navbtn:disabled { color: var(--text-faint); }
  .navbtn svg { width: 16px; height: 16px; fill: currentColor; }

  #omnibox {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    margin: 0 6px;
    padding: 0 14px;
    border-radius: 15px;
    background: var(--omnibox-bg);
  }
  #omnibox:focus-within { background: var(--omnibox-focus); box-shadow: 0 0 0 2px var(--accent); }

  /* Security state is signalled by SHAPE, not colour — a padlock or a warning
     triangle. A monochrome palette can't lean on red, and shape is legible to
     colourblind users anyway. */
  #lock { flex: 0 0 14px; width: 14px; height: 14px; fill: var(--text-dim); }
  #lock .warn { display: none; }
  #lock.insecure { fill: var(--text); }
  #lock.insecure .shut { display: none; }
  #lock.insecure .warn { display: block; }

  #url {
    flex: 1 1 auto;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 13px;
    user-select: text;
  }
  #url::placeholder { color: var(--text-dim); }

  /* ---------- Search engine picker ---------- */
  #engine {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 9px;
    margin-right: 2px;
    border: 0;
    border-radius: 12px;
    background: rgba(0,0,0,.06);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    white-space: nowrap;
    cursor: default;
  }
  #engine:hover { background: rgba(0,0,0,.11); }
  #engine svg { width: 12px; height: 12px; fill: currentColor; flex: 0 0 12px; }

  /* Anchored under the toolbar: 40px tab strip + 44px toolbar. */
  #enginemenu {
    position: absolute;
    top: 84px;
    right: 8px;
    z-index: 10;
    min-width: 232px;
    padding: 5px;
    border-radius: 10px;
    background: var(--tab-active);
    box-shadow: 0 0 0 1px var(--border), 0 10px 28px rgba(0,0,0,.16);
    display: none;
  }
  #enginemenu.open { display: block; }

  .engine-opt {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 7px 9px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: default;
  }
  .engine-opt:hover { background: var(--tab-hover); }
  .engine-opt .tick {
    flex: 0 0 13px;
    width: 13px; height: 13px;
    fill: var(--text);
    visibility: hidden;
  }
  .engine-opt.active .tick { visibility: visible; }
  .engine-opt .label { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .engine-opt .label b { font-weight: 600; font-size: 12px; }
  .engine-opt .label small { color: var(--text-dim); font-size: 10.5px; }

  /* SearXNG instance editor, shown under that row when it's the live engine.
     Public instances die; this makes swapping one a five-second job instead
     of a source edit. */
  .instance {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 2px 5px 6px 31px;   /* 31px lines up with the option label */
  }
  .instance input {
    width: 100%;
    height: 26px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--toolbar-bg);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    outline: 0;
    user-select: text;
  }
  .instance input:focus { border-color: var(--text); }
  .instance small { color: var(--text-dim); font-size: 10px; line-height: 1.35; }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    padding: 2px 7px;
    border: 0;
    border-radius: 9px;
    background: rgba(0,0,0,.06);
    color: var(--text-dim);
    font: inherit;
    font-size: 10px;
    cursor: default;
  }
  .chip:hover { background: rgba(0,0,0,.12); color: var(--text); }
  .chip.active { background: var(--text); color: var(--tab-active); }

  /* The shield is both the blocked-request counter and the way into the
     privacy panel. It is always present — a protection you can't find is a
     protection you don't trust — but the NUMBER only appears once something
     has actually been blocked, so it still reads as a result rather than as
     decoration. */
  #shield {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 9px 0 7px;
    margin-right: 2px;
    border: 0;
    border-radius: 12px;
    background: rgba(0,0,0,.06);
    color: var(--text-dim);
    font: inherit;
    cursor: default;
    position: relative;
  }
  #shield:hover { background: rgba(0,0,0,.11); color: var(--text); }
  #shield.on { color: var(--text); }
  #shield svg { width: 13px; height: 13px; fill: currentColor; flex: 0 0 13px; }
  #shield span { font-size: 11px; font-variant-numeric: tabular-nums; display: none; }
  #shield.on span { display: inline; }

  /* Something was denied on this page and there's a decision waiting. A dot,
     not a modal — the page is never interrupted. */
  #shield.attention::after {
    content: '';
    position: absolute;
    top: 3px; right: 4px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 0 2px var(--toolbar-bg);
  }

  /* ---------- Privacy panel ---------- */
  /* Same anchoring as the engine menu: below the 40px strip + 44px toolbar. */
  #privacypanel {
    position: absolute;
    top: 84px;
    right: 8px;
    z-index: 11;
    width: 310px;
    max-height: calc(100% - 100px);
    overflow-y: auto;
    padding: 4px;
    border-radius: 10px;
    background: var(--tab-active);
    box-shadow: 0 0 0 1px var(--border), 0 10px 28px rgba(0,0,0,.16);
    display: none;
  }
  #privacypanel.open { display: block; }

  .pp-head {
    padding: 10px 11px 8px;
    border-bottom: 1px solid var(--border);
  }
  .pp-host {
    font-size: 13px;
    font-weight: 600;
    word-break: break-all;
  }
  .pp-sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .pp-section { padding: 8px 4px 4px; }
  .pp-section > h4 {
    margin: 0 0 2px;
    padding: 0 7px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .pp-section + .pp-section { border-top: 1px solid var(--border); }

  /* One row per protection. The whole row is the target — a 12px checkbox is
     a bad click target and a worse toggle. */
  .pp-row {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 7px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    text-align: left;
    cursor: default;
  }
  .pp-row:hover { background: var(--tab-hover); }
  .pp-row .label { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pp-row .label small { color: var(--text-dim); font-size: 10.5px; line-height: 1.35; }

  /* Monochrome switch: filled = on. Shape and fill, no colour. */
  .pp-row .sw {
    flex: 0 0 26px;
    width: 26px; height: 15px;
    border-radius: 8px;
    background: var(--border);
    position: relative;
    transition: background .12s;
  }
  .pp-row .sw::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--tab-active);
    transition: transform .12s;
  }
  .pp-row.on .sw { background: var(--text); }
  .pp-row.on .sw::after { transform: translateX(11px); }

  .pp-row.danger { color: var(--text); }
  .pp-row.danger:hover { background: var(--tab-hover); }

  .pp-empty {
    padding: 4px 7px 8px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .pp-select {
    display: flex;
    gap: 4px;
    padding: 2px 7px 8px;
  }
  .pp-select .chip { font-size: 10px; }

  /* ---------- Extensions toolbar & button ---------- */
  #exttoolbar {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .ext-pinned-btn {
    width: 24px;
    height: 24px;
    padding: 3px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    cursor: default;
    display: grid;
    place-items: center;
    color: var(--text);
  }
  .ext-pinned-btn:hover { background: rgba(0,0,0,.08); }
  .ext-pinned-btn img {
    width: 16px;
    height: 16px;
    object-fit: contain;
    border-radius: 2px;
  }
  .ext-pinned-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  #extbtn {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 9px 0 7px;
    margin-right: 2px;
    border: 0;
    border-radius: 12px;
    background: rgba(0,0,0,.06);
    color: var(--text-dim);
    font: inherit;
    cursor: default;
    position: relative;
  }
  #extbtn:hover { background: rgba(0,0,0,.11); color: var(--text); }
  #extbtn.active { background: rgba(0,0,0,.14); color: var(--text); }
  #extbtn.has-extensions { color: var(--text); }
  #extbtn svg { width: 13px; height: 13px; fill: currentColor; flex: 0 0 13px; }
  #extbtn span { font-size: 11px; font-variant-numeric: tabular-nums; display: none; }
  #extbtn.has-extensions span { display: inline; }

  /* ---------- Extensions panel ---------- */
  #extensionspanel {
    position: absolute;
    top: 84px;
    right: 8px;
    z-index: 12;
    width: 320px;
    max-height: calc(100% - 100px);
    overflow-y: auto;
    padding: 5px;
    border-radius: 10px;
    background: var(--tab-active);
    box-shadow: 0 0 0 1px var(--border), 0 10px 28px rgba(0,0,0,.16);
    display: none;
  }
  #extensionspanel.open { display: block; }

  .ext-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px 6px;
    border-bottom: 1px solid var(--border);
  }
  .ext-panel-title {
    font-size: 13px;
    font-weight: 600;
  }
  .ext-panel-count {
    font-size: 11px;
    color: var(--text-dim);
  }

  .ext-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 6px 0;
  }

  .ext-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px 9px;
    border-radius: 7px;
    background: var(--toolbar-bg);
    border: 1px solid var(--border);
  }
  .ext-item-main {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .ext-item-icon {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    object-fit: contain;
    border-radius: 3px;
  }
  .ext-item-icon-svg {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    fill: var(--text-dim);
  }
  .ext-item-details {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .ext-item-name-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .ext-item-name {
    font-weight: 600;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ext-item-ver {
    font-size: 10px;
    color: var(--text-dim);
    flex: 0 0 auto;
  }
  .ext-item-desc {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .ext-item-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    padding-top: 5px;
    border-top: 1px solid rgba(0,0,0,.06);
  }
  .ext-action-btn {
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--tab-active);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    cursor: default;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .ext-action-btn:hover { background: var(--tab-hover); }
  .ext-action-btn.active { background: var(--text); color: var(--tab-active); border-color: var(--text); }
  .ext-action-btn.danger { color: #c62828; }
  .ext-action-btn.danger:hover { background: #ffebee; border-color: #ef9a9a; }
  .ext-action-btn svg { width: 11px; height: 11px; fill: currentColor; }

  .ext-empty {
    padding: 16px 12px;
    text-align: center;
    color: var(--text-dim);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .ext-empty svg {
    width: 28px;
    height: 28px;
    fill: var(--text-faint);
  }
  .ext-empty b {
    font-size: 12px;
    color: var(--text);
  }
  .ext-empty small {
    font-size: 11px;
    line-height: 1.4;
  }

  .ext-footer {
    padding: 6px 2px 2px;
    border-top: 1px solid var(--border);
  }
  .ext-load-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 10px;
    border: 1px dashed var(--border);
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 11.5px;
    font-weight: 500;
    cursor: default;
  }
  .ext-load-btn:hover {
    background: var(--tab-hover);
    border-color: var(--text);
  }
  .ext-load-btn svg {
    width: 13px;
    height: 13px;
    fill: currentColor;
  }

  .ext-error {
    margin: 4px 0;
    padding: 6px 8px;
    border-radius: 6px;
    background: #ffebee;
    color: #c62828;
    font-size: 11px;
    display: none;
  }
  .ext-error.show { display: block; }

  /* ---------- Bookmark Omnibox button ---------- */
  #bookmarkbtn {
    flex: 0 0 24px;
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    cursor: default;
    padding: 0;
    transition: background .12s, color .12s;
  }
  #bookmarkbtn:hover:not(:disabled) {
    background: rgba(0,0,0,.08);
    color: var(--text);
  }
  #bookmarkbtn:disabled {
    color: var(--text-faint);
    cursor: default;
  }
  #bookmarkbtn svg {
    width: 15px;
    height: 15px;
  }
  #bookmarkbtn .star-filled { display: none; }
  #bookmarkbtn .star-outline { display: block; }
  #bookmarkbtn.bookmarked {
    color: var(--text);
  }
  #bookmarkbtn.bookmarked .star-filled { display: block; }
  #bookmarkbtn.bookmarked .star-outline { display: none; }

  /* ---------- Bookmarks toolbar button ---------- */
  #bookmarksbtn {
    display: flex;
    align-items: center;
    gap: 5px;
    height: 24px;
    padding: 0 8px;
    margin-right: 2px;
    border: 0;
    border-radius: 12px;
    background: rgba(0,0,0,.06);

  }
  #bookmarksbtn:hover { background: rgba(0,0,0,.11); color: var(--text); }
  #bookmarksbtn.active { background: rgba(0,0,0,.14); color: var(--text); }
  #bookmarksbtn svg { width: 13px; height: 13px; fill: currentColor; }

  /* ---------- Bookmarks bar ---------- */
  #bookmarksbar {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 28px;
    padding: 0 8px;
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
    overflow-x: auto;
    overflow-y: hidden;
  }
  #bookmarksbar::-webkit-scrollbar { display: none; }
  #bookmarksbaritems {
    display: flex;
    align-items: center;
    gap: 3px;
    min-width: 0;
  }
  .bm-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 22px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 11.5px;
    cursor: default;
    max-width: 170px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }
  .bm-item:hover { background: rgba(0,0,0,.08); }
  .bm-item-icon {
    width: 14px;
    height: 14px;
    flex: 0 0 14px;
    object-fit: contain;
    border-radius: 2px;
  }
  .bm-item-icon-svg {
    width: 13px;
    height: 13px;
    flex: 0 0 13px;
    fill: var(--text-dim);
  }
  .bm-item-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bm-empty-hint {
    font-size: 11px;
    color: var(--text-dim);
    padding: 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bm-empty-btn {
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--tab-active);
    color: var(--text);
    font: inherit;
    font-size: 10.5px;
    cursor: default;
  }
  .bm-empty-btn:hover { background: var(--tab-hover); }

  /* ---------- Bookmark popup ---------- */
  #bookmarkpopup {
    position: absolute;
    top: 80px;
    right: 120px;
    z-index: 20;
    width: 310px;
    padding: 12px;
    border-radius: 10px;
    background: var(--tab-active);
    box-shadow: 0 0 0 1px var(--border), 0 10px 28px rgba(0,0,0,.16);
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  #bookmarkpopup.open { display: flex; }
  .bm-popup-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .bm-popup-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .bm-popup-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bm-popup-field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .bm-popup-field span {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-dim);
  }
  .bm-popup-field input {
    width: 100%;
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--toolbar-bg);
    color: var(--text);
    font: inherit;
    font-size: 12px;
    outline: 0;
    user-select: text;
  }
  .bm-popup-field input:focus {
    border-color: var(--text);
    background: var(--tab-active);
  }
  .bm-popup-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 4px;
    border-top: 1px solid rgba(0,0,0,.06);
  }
  .bm-popup-btn {
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--tab-active);
    color: var(--text);
    font: inherit;
    font-size: 11.5px;
    font-weight: 500;
    cursor: default;
  }
  .bm-popup-btn:hover { background: var(--tab-hover); }
  .bm-popup-btn.primary {
    background: var(--text);
    color: var(--tab-active);
    border-color: var(--text);
  }
  .bm-popup-btn.primary:hover { background: #333333; }
  .bm-popup-btn.danger {
    color: #c62828;
    border-color: var(--border);
  }
  .bm-popup-btn.danger:hover {
    background: #ffebee;
    border-color: #ef9a9a;
  }

  /* ---------- Bookmarks panel ---------- */
  #bookmarkspanel {
    position: absolute;
    top: 84px;
    right: 8px;
    z-index: 12;
    width: 320px;
    max-height: calc(100% - 100px);
    overflow-y: auto;
    padding: 5px;
    border-radius: 10px;
    background: var(--tab-active);
    box-shadow: 0 0 0 1px var(--border), 0 10px 28px rgba(0,0,0,.16);
    display: none;
  }
  #bookmarkspanel.open { display: block; }
  .bmp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px 6px;
    border-bottom: 1px solid var(--border);
  }
  .bmp-title {
    font-size: 13px;
    font-weight: 600;
  }
  .bmp-count {
    font-size: 11px;
    color: var(--text-dim);
  }
  .bmp-search-wrap {
    padding: 6px 4px 4px;
  }
  .bmp-search {
    width: 100%;
    height: 26px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--toolbar-bg);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    outline: 0;
    user-select: text;
  }
  .bmp-search:focus {
    border-color: var(--text);
    background: var(--tab-active);
  }
  .bmp-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px 0;
    max-height: 320px;
    overflow-y: auto;
  }
  .bmp-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 7px;
    cursor: default;
  }
  .bmp-item:hover {
    background: var(--tab-hover);
  }
  .bmp-item-icon {
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
    object-fit: contain;
    border-radius: 2px;
  }
  .bmp-item-icon-svg {
    width: 14px;
    height: 14px;
    flex: 0 0 14px;
    fill: var(--text-dim);
  }
  .bmp-item-info {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .bmp-item-title {
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bmp-item-url {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .bmp-item-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    opacity: 0;
  }
  .bmp-item:hover .bmp-item-actions {
    opacity: 1;
  }
  .bmp-icon-btn {
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text-dim);
    cursor: default;
    padding: 0;
  }
  .bmp-icon-btn:hover {
    background: var(--border);
    color: var(--text);
  }
  .bmp-icon-btn.danger:hover {
    color: #c62828;
    background: #ffebee;
  }
  .bmp-icon-btn svg {
    width: 13px;
    height: 13px;
    fill: currentColor;
  }
  .bmp-empty {
    padding: 16px 12px;
    text-align: center;
    color: var(--text-dim);
    font-size: 11.5px;
  }
  .bmp-footer {
    padding: 6px 4px 2px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .bmp-footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 6px;
    font-size: 11.5px;
    color: var(--text);
  }
  .bmp-add-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 10px;
    border: 1px dashed var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 11.5px;
    cursor: default;
  }
  .bmp-add-btn:hover {
    background: var(--tab-hover);
    border-color: var(--text);
  }
  .bmp-add-btn svg {
    width: 12px;
    height: 12px;
    fill: currentColor;
  }

  /* ---------- Bookmarks context menu ---------- */
  #bmcontextmenu {
    position: absolute;
    z-index: 25;
    min-width: 130px;
    padding: 4px;
    border-radius: 8px;
    background: var(--tab-active);
    box-shadow: 0 0 0 1px var(--border), 0 8px 24px rgba(0,0,0,.15);
    display: none;
  }
  #bmcontextmenu.open { display: block; }
  .bm-ctx-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 5px 8px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 11.5px;
    cursor: default;
    text-align: left;
  }
  .bm-ctx-item:hover { background: var(--tab-hover); }
  .bm-ctx-item.danger { color: #c62828; }
  .bm-ctx-item.danger:hover { background: #ffebee; }

  /* ---------- Insecure-connection bar ---------- */
  /* Sits over the page area rather than replacing it: an interstitial that
     blocks the whole page teaches people to click through interstitials. */
  #insecurebar {
    position: absolute;
    left: 0; right: 0; top: 0;
    z-index: 5;
    display: none;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  #insecurebar.show { display: flex; }
  #insecurebar svg { width: 15px; height: 15px; fill: var(--text); flex: 0 0 15px; }
  #insecurebar .msg { flex: 1 1 auto; min-width: 0; }
  #insecurebar .msg b { font-weight: 600; }
  #insecurebar .msg small { display: block; color: var(--text-dim); font-size: 10.5px; }
  #insecurebar button {
    flex: 0 0 auto;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--tab-active);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    cursor: default;
  }
  #insecurebar button:hover { background: var(--tab-hover); }
  #insecurebar button.primary { background: var(--text); color: var(--tab-active); border-color: var(--text); }

  /* ---------- Private tabs ---------- */
  /* A private tab must be obvious at a glance, or you will type something
     into the wrong one. Inverted fill, which no other tab state uses. */
  .tab.private { background: rgba(0,0,0,.10); }
  .tab.private.active { background: var(--text); }
  .tab.private.active .tab-title,
  .tab.private.active .tab-close { color: var(--tab-active); }
  .tab.private .favicon.blank { background: var(--text-dim); }
  .tab.private .mask {
    flex: 0 0 13px;
    width: 13px; height: 13px;
    fill: currentColor;
    opacity: .8;
  }
  .tab:not(.private) .mask { display: none; }

  /* ---------- Page area ---------- */
  /* The page floats inside the window instead of filling it edge to edge —
     an 8px gutter of pure black on three sides, with rounded corners. */
  #views {
    flex: 1 1 auto;
    position: relative;
    margin: 0 8px 8px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--border);
    background: #fff;
    min-height: 0;
  }
  /* Each tab's page sits in a wrapper, and the WRAPPER is what we show/hide.
     Electron requires <webview> to keep display:flex — overriding it (e.g.
     with display:none) breaks how the guest page is measured and sized. */
  .view-wrap {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    overflow: hidden;
    display: none;
  }
  .view-wrap.active { display: block; }

  webview {
    display: flex;   /* required by Electron — do not override */
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* ---------- Cast Button & Panel ---------- */
  #castbtn {
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text-dim);
    display: grid;
    place-items: center;
    position: relative;
    cursor: default;
    transition: background .12s, color .12s;
  }
  #castbtn:hover { background: rgba(0,0,0,.08); color: var(--text); }
  #castbtn.active { background: rgba(0,0,0,.12); color: var(--text); }
  #castbtn svg { width: 16px; height: 16px; fill: currentColor; }

  #castbtn.streaming {
    color: var(--text);
    background: rgba(0,0,0,.08);
  }
  #castdot {
    position: absolute;
    top: 5px; right: 5px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #e53e3e;
    box-shadow: 0 0 0 2px var(--toolbar-bg);
    display: none;
  }
  #castbtn.streaming #castdot {
    display: block;
    animation: castPulse 1.5s infinite;
  }
  @keyframes castPulse {
    0% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 6px rgba(229, 62, 62, 0.8); }
    100% { transform: scale(0.9); opacity: 0.7; }
  }

  /* Popover Dialog */
  #castpanel {
    position: absolute;
    top: 84px;
    right: 8px;
    z-index: 12;
    width: 360px;
    max-height: calc(100% - 100px);
    overflow-y: auto;
    padding: 12px;
    border-radius: 12px;
    background: var(--tab-active);
    box-shadow: 0 0 0 1px var(--border), 0 12px 32px rgba(0,0,0,.18);
    display: none;
  }
  #castpanel.open { display: block; }

  .cp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .cp-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cp-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }
  .cp-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .05em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 10px;
    background: rgba(0,0,0,.06);
    color: var(--text-dim);
  }
  .cp-badge.live {
    background: #fee2e2;
    color: #b91c1c;
    border: 1px solid #fca5a5;
  }
  .cp-close-btn {
    width: 22px; height: 22px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1;
    display: grid;
    place-items: center;

  .cp-section {

  .cp-section-title {

    align-items: center;

  /* Source chips */
  .cp-source-chips {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
  }
  .cp-source-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 4px;
    border: 1px solid var(--border);

  .cp-source-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .cp-source-btn:hover { background: var(--tab-hover); border-color: #bbb; }
  .cp-source-btn.active {
    background: var(--text);

  /* Quality chips */

  .cp-quality-chip:hover { background: var(--tab-hover); color: var(--text); }
  .cp-quality-chip.active {
    background: rgba(0,0,0,.08);
    color: var(--text);
    font-weight: 600;
    border-color: var(--text);
  }

  /* Big Action Button */
  .cp-action-row {
    padding-top: 10px;
    display: flex;
    gap: 8px;
  }
  .cp-start-btn {
    flex: 1;
    height: 32px;
    border: 0;
    border-radius: 7px;
    background: var(--text);
    color: var(--tab-active);

    font-size: 12px;

    flex: 1;
    height: 32px;
    border: 1px solid #ef4444;
    border-radius: 7px;
    background: #fee2e2;
    color: #b91c1c;
    font: inherit;
    font-size: 12px;

  .cp-pause-btn {

  /* Direct Connect & QR Card */
  .cp-connect-card {
    background: rgba(0,0,0,.03);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 6px;

    display: flex;
    align-items: center;
    gap: 6px;
  }

    flex: 1;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;

    color: var(--text);

    background: var(--tab-active);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

  .cp-copy-btn, .cp-open-btn {
    height: 26px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 4px;

  .cp-qr-svg svg {

  /* Discovered Smart TVs & Cast Devices */

    align-items: center;

  .cp-device-info {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }
  .cp-device-icon {
    width: 20px; height: 20px;
    flex: 0 0 20px;
    color: var(--text);
    display: grid;
    place-items: center;

  .cp-device-icon svg { width: 16px; height: 16px; fill: currentColor; }
  .cp-device-texts {
    display: flex;
    flex-direction: column;
    min-width: 0;

  .cp-device-name {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cp-device-meta {
    font-size: 9.5px;
    color: var(--text-dim);
  }
  .cp-device-action-btn {
    height: 24px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--tab-active);
    color: var(--text);
    font: inherit;
    font-size: 10.5px;
    font-weight: 500;
    cursor: default;
    white-space: nowrap;
  }
  .cp-device-action-btn:hover { background: var(--text); color: var(--tab-active); }

  .cp-empty-state {
    padding: 8px;
    font-size: 11px;
    color: var(--text-dim);
    text-align: center;
  }

  .cp-scan-btn {
    background: transparent;
    border: 0;
    color: var(--text-dim);
    cursor: default;
    font: inherit;
    font-size: 10px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .cp-scan-btn:hover { background: var(--tab-hover); color: var(--text); }
  .cp-scan-btn.scanning svg { animation: spin .7s linear infinite; }
  .cp-scan-btn svg { width: 10px; height: 10px; fill: currentColor; }

  /* Stats row when live */
  .cp-stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
  }
  .cp-stat-box {
    background: rgba(0,0,0,.03);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
    text-align: center;
  }
  .cp-stat-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .cp-stat-label {
    font-size: 9.5px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* Connected Viewers section */
  .cp-viewers-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 6px;
  }
  .cp-viewer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    background: rgba(16, 185, 129, .08);
    border: 1px solid rgba(16, 185, 129, .25);
    border-radius: 6px;
    gap: 8px;
  }
  .cp-viewer-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    color: #059669;
    padding: 2px 6px;
    border-radius: 10px;
    background: rgba(16, 185, 129, .15);
  }
  .cp-viewer-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #10b981;
    animation: pulse 1.4s infinite;
  }

  /* Manual IP input bar */
  .cp-add-ip-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    padding: 6px;
    background: rgba(0,0,0,.03);
    border: 1px dashed var(--border);
    border-radius: 6px;
  }
  .cp-add-ip-input {
    flex: 1;
    height: 24px;
    padding: 0 6px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--tab-active);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    outline: 0;
  }
  .cp-add-ip-input:focus { border-color: var(--text); }
  .cp-add-ip-submit {
    height: 24px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--text);
    color: var(--tab-active);
    font: inherit;
    font-size: 10.5px;
    cursor: default;
    white-space: nowrap;
  }
  .cp-add-ip-submit:hover { opacity: .9; }

  /* In-panel notification / banner */
  .cp-cast-banner {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    background: rgba(59, 130, 246, .08);
    border: 1px solid rgba(59, 130, 246, .3);
    color: var(--text);
    font-size: 11px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cp-cast-banner-title {
    font-weight: 600;
    color: #1d4ed8;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cp-cast-banner-close {
    background: transparent;
    border: 0;
    color: var(--text-dim);
    cursor: default;
    font-size: 12px;
    padding: 0 4px;
  }
  .cp-cast-banner-close:hover { color: var(--text); }
</style>
</head>
<body>
  <div id="app">

    <div id="tabstrip">
      <div id="tabs"></div>
      <button id="newtab" title="New tab (Ctrl+T)">+</button>
    </div>

    <div id="toolbar">
      <button class="navbtn" id="back" title="Back (Alt+Left)" disabled>
        <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
      </button>
      <button class="navbtn" id="forward" title="Forward (Alt+Right)" disabled>
        <svg viewBox="0 0 24 24"><path d="M4 13h12.2l-5.6 5.6L12 20l8-8-8-8-1.4 1.4 5.6 5.6H4z"/></svg>
      </button>
      <button class="navbtn" id="reload" title="Reload (Ctrl+R)">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1 0 19.73 14h-2.08A6 6 0 1 1 12 6a5.9 5.9 0 0 1 4.22 1.78L13 11h7V4z"/></svg>
      </button>
      <button class="navbtn" id="home" title="Home">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </button>

      <div id="omnibox">
        <svg id="lock" viewBox="0 0 24 24">
          <path class="shut" d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9zm3 13a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/>
          <path class="warn" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
        </svg>
        <input id="url" type="text" spellcheck="false" autocomplete="off"
               placeholder="Search or type a URL" />
        <button id="bookmarkbtn" title="Bookmark this tab (Ctrl+D)">
          <svg viewBox="0 0 24 24">
            <path class="star-outline" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path class="star-filled" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <button id="engine" title="Change search engine">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <span id="enginename">—</span>
      </button>

      <div id="exttoolbar"></div>

      <button id="extbtn" title="Extensions">
        <svg viewBox="0 0 24 24"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5a2.5 2.5 0 0 0-5 0V5H4c-1.1 0-1.99.9-1.99 2v3.8H3.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7s2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5a2.5 2.5 0 0 0 0-5z"/></svg>
        <span id="extcount">0</span>
      </button>

      <button id="bookmarksbtn" title="Bookmarks">
        <svg viewBox="0 0 24 24"><path d="M19 18l2 1V3c0-1.1-.9-2-2-2H8.99C7.89 1 7 1.9 7 3h10c1.1 0 2 .9 2 2v13zM15 5H5c-1.1 0-2 .9-2 2v16l7-3 7 3V7c0-1.1-.9-2-2-2z"/></svg>
      </button>

      <button id="castbtn" title="Cast screen or tab to other devices (Alt+C)">
        <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.92-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        <span id="castdot"></span>
      </button>

      <button id="shield" title="Privacy for this site">
        <svg viewBox="0 0 24 24"><path d="M12 1 3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
        <span id="blockcount">0</span>
      </button>
    </div>

    <!-- Bookmarks Bar -->
    <div id="bookmarksbar">
      <div id="bookmarksbaritems"></div>
    </div>

    <!-- Populated by renderer.js from SEARCH_ENGINES. -->
    <div id="enginemenu"></div>

    <!-- Populated by renderer.js. Every strict default the browser ships with
         is switchable from here — that is what makes them defensible rather
         than merely opinionated. -->
    <div id="privacypanel"></div>

    <!-- Populated by renderer.js for extension management and actions. -->
    <div id="extensionspanel"></div>

    <!-- Bookmark popover bubble -->
    <div id="bookmarkpopup">
      <div class="bm-popup-head">
        <span id="bmpopuptitle" class="bm-popup-title">Bookmark added</span>
      </div>
      <div class="bm-popup-body">
        <label class="bm-popup-field">
          <span>Name</span>
          <input id="bmpopupname" type="text" spellcheck="false" autocomplete="off" />
        </label>
        <label class="bm-popup-field">
          <span>URL</span>
          <input id="bmpopupurl" type="text" spellcheck="false" autocomplete="off" />
        </label>
      </div>
      <div class="bm-popup-actions">
        <button id="bmpopupremove" class="bm-popup-btn danger">Remove</button>
        <div style="flex: 1 1 auto;"></div>
        <button id="bmpopupdone" class="bm-popup-btn primary">Done</button>
      </div>
    </div>

    <!-- Populated by renderer.js for bookmark management. -->
    <div id="bookmarkspanel"></div>

    <!-- Populated by renderer.js for screen and tab casting. -->
    <div id="castpanel"></div>

    <!-- Context menu for bookmark items -->
    <div id="bmcontextmenu">
      <button class="bm-ctx-item" id="bmctxopen">Open</button>
      <button class="bm-ctx-item" id="bmctxnewtab">Open in new tab</button>
      <button class="bm-ctx-item" id="bmctxedit">Edit…</button>
      <button class="bm-ctx-item danger" id="bmctxdelete">Delete</button>
    </div>

    <div id="views">
      <!-- Shown only when an HTTPS upgrade failed because the site has no
           HTTPS at all. Built here rather than in JS so it can't be missing
           at the moment it's needed. -->
      <div id="insecurebar">
        <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        <div class="msg">
          <b>This site has no HTTPS</b>
          <small id="insecuredetail">Anyone on the network can read and change what you send.</small>
        </div>
        <button id="insecureback" class="primary">Go back</button>
        <button id="insecurego">Continue anyway</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
